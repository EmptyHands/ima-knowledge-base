services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: ima-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped

  redis:
    image: redis/redis-stack-server:latest   # redis:7-alpine 缺 RediSearch, langgraph-checkpoint-redis 需要
    container_name: ima-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile   # requirements.txt 在仓库根, context 必须为根
    env_file: .env
    environment:
      - QDRANT_HOST=qdrant
      - REDIS_HOST=redis
      - EMBEDDING_BASE_URL=http://host.docker.internal:11434
      - APP_HOST=0.0.0.0
      - APP_PORT=8000
    volumes:
      - ima_data:/app/data
    depends_on:
      - qdrant
      - redis
    deploy:
      replicas: 1   # 横向扩展: docker compose up -d --scale backend=N

  nginx:
    image: nginx:alpine
    container_name: ima-nginx
    ports:
      - "8000:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  qdrant_data:
  redis_data:
  ima_data:
